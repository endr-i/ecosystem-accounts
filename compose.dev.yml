services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: accounts
      POSTGRES_PASSWORD: accounts
      POSTGRES_DB: accounts
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounts -d accounts"]
      interval: 5s
      timeout: 3s
      retries: 10

  accounts:
    build: .
    environment:
      DATABASE_URL: postgres://accounts:accounts@db:5432/accounts?sslmode=disable
      # Address of ecosystem-auth; the JWKS URL is derived from it.
      AUTH_BASE_URL: http://ecosystem-auth:8080
      # The `iss` claim ecosystem-auth puts in its tokens (an identifier, not a URL).
      AUTH_ISSUER: ecosystem-auth
      PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
